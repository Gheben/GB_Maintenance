<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#1e40af"/>
  <!-- Gear ring -->
  <g transform="translate(16,15)">
    <circle r="7.5" fill="none" stroke="#60a5fa" stroke-width="1.4"/>
    <!-- 8 teeth -->
    <g stroke="#60a5fa" stroke-width="1.4" stroke-linecap="round">
      <line x1="0" y1="-7.5" x2="0" y2="-9.8"/>
      <line x1="5.3" y1="-5.3" x2="6.9" y2="-6.9"/>
      <line x1="7.5" y1="0" x2="9.8" y2="0"/>
      <line x1="5.3" y1="5.3" x2="6.9" y2="6.9"/>
      <line x1="0" y1="7.5" x2="0" y2="9.8"/>
      <line x1="-5.3" y1="5.3" x2="-6.9" y2="6.9"/>
      <line x1="-7.5" y1="0" x2="-9.8" y2="0"/>
      <line x1="-5.3" y1="-5.3" x2="-6.9" y2="-6.9"/>
    </g>
    <circle r="3.2" fill="#1e40af" stroke="#93c5fd" stroke-width="1.2"/>
    <circle r="1.2" fill="#93c5fd"/>
  </g>
  <!-- Wrench -->
  <g transform="translate(16,15) rotate(45)">
    <rect x="-1" y="1.5" width="2" height="9" rx="1" fill="#bfdbfe"/>
    <path d="M-2.8,-1.5 A2.8,2.8 0 0,1 2.8,-1.5 L2.1,1.8 A1.8,1.8 0 0,0 -2.1,1.8 Z" fill="#bfdbfe"/>
  </g>
  <!-- "GB" text -->
  <text x="16" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="6.5" fill="#93c5fd">GB</text>
</svg>
