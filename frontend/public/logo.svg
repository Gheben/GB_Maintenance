<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="#1e40af"/>

  <!-- Outer gear ring -->
  <g transform="translate(256,240)">
    <circle r="120" fill="none" stroke="#60a5fa" stroke-width="20"/>
    <!-- Gear teeth (12 teeth) -->
    <g stroke="#60a5fa" stroke-width="20" stroke-linecap="round">
      <line x1="0" y1="-120" x2="0" y2="-148"/>
      <line x1="62.1" y1="-107.4" x2="77.0" y2="-133.4"/>
      <line x1="107.4" y1="-62.1" x2="133.4" y2="-77.0"/>
      <line x1="120" y1="0" x2="148" y2="0"/>
      <line x1="107.4" y1="62.1" x2="133.4" y2="77.0"/>
      <line x1="62.1" y1="107.4" x2="77.0" y2="133.4"/>
      <line x1="0" y1="120" x2="0" y2="148"/>
      <line x1="-62.1" y1="107.4" x2="-77.0" y2="133.4"/>
      <line x1="-107.4" y1="62.1" x2="-133.4" y2="77.0"/>
      <line x1="-120" y1="0" x2="-148" y2="0"/>
      <line x1="-107.4" y1="-62.1" x2="-133.4" y2="-77.0"/>
      <line x1="-62.1" y1="-107.4" x2="-77.0" y2="-133.4"/>
    </g>
    <!-- Inner circle (hub) -->
    <circle r="50" fill="#1e40af" stroke="#93c5fd" stroke-width="16"/>
    <!-- Inner dot -->
    <circle r="18" fill="#93c5fd"/>
  </g>

  <!-- Wrench handle going down-right -->
  <g transform="translate(256,240) rotate(45)">
    <!-- Wrench shaft -->
    <rect x="-14" y="30" width="28" height="130" rx="14" fill="#bfdbfe"/>
    <!-- Wrench head (open end) -->
    <path d="M-38,-20 A40,40 0 0,1 38,-20 L30,20 A28,28 0 0,0 -30,20 Z" fill="#bfdbfe"/>
    <circle cx="-26" cy="4" r="10" fill="#1e40af"/>
    <circle cx="26" cy="4" r="10" fill="#1e40af"/>
  </g>

  <!-- GB initials at bottom -->
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" letter-spacing="-2" fill="#93c5fd">GB</text>
</svg>
